name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.22.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create . --project-name wine_tasting --org com.winetasting --platforms=android

      # 런처 아이콘(와인 글라스)과 앱 이름 적용. 아이콘은 android_assets/ (scripts/generate_icons.mjs).
      - name: Apply launcher icon and app name
        run: |
          for d in android_assets/mipmap-*; do
            cp "$d/ic_launcher.png" "android/app/src/main/res/$(basename "$d")/ic_launcher.png"
          done
          sed -i 's/android:label="wine_tasting"/android:label="와인노트"/' android/app/src/main/AndroidManifest.xml

      # url_launcher 가 외부 브라우저(https)를 열 수 있도록 Android 11+ 패키지 가시성 쿼리 추가
      - name: Patch Android manifest (url_launcher queries)
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          q = '''<queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>'''
          if 'android.intent.action.VIEW' not in s:
              s = s.replace('<queries>', q, 1) if '<queries>' in s else \
                  s.replace('</manifest>', q + '\n    </queries>\n</manifest>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Create .env
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      # 서명 키 없이 빌드하면 Flutter 템플릿 기본값(debug 키)으로 서명된다.
      # 개인 설치용으로는 충분하지만 스토어 배포 전에는 업로드 키 서명을 추가할 것
      # (Mobile-Application-Maker 의 patch_android_signing.py 방식).
      - name: Build APK (release)
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: wine-tasting-apk-build${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

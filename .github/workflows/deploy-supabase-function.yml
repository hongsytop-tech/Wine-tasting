name: Deploy Supabase Functions (wine-search, tasting-suggest)

# 수동 실행 전용. 대시보드 편집기에 여러 파일(_shared/cors.ts 포함)을 붙여넣는 대신
# Supabase CLI 로 supabase/functions/wine-search 를 그대로 배포한다.
# 필요한 저장소 Secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF (docs/SETUP.md)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=0
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Secret SUPABASE_ACCESS_TOKEN 이 없습니다 (docs/SETUP.md 2단계)"; missing=1; }
          [ -n "$PROJECT_REF" ] || { echo "::error::Secret SUPABASE_PROJECT_REF 가 없습니다 (docs/SETUP.md 2단계)"; missing=1; }
          exit $missing

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        run: supabase functions deploy wine-search tasting-suggest --project-ref "$PROJECT_REF" --use-api

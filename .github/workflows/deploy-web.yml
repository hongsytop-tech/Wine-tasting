name: Deploy Web (GitHub Pages)

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.22.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Regenerate platform folders (web/) that are gitignored.
      - name: flutter create
        run: flutter create --platforms web --project-name wine_tasting .

      - name: Inject app branding (manifest, title)
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          m = pathlib.Path('web/manifest.json')
          data = json.loads(m.read_text(encoding='utf-8'))
          data.update({
              'name': '와인노트',
              'short_name': '와인노트',
              'description': '와인 검색·즐겨찾기·평점·테이스팅 노트',
              'background_color': '#FFFFFF',
              'theme_color': '#7B1E3A',
              'orientation': 'portrait-primary',
          })
          m.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')

          p = pathlib.Path('web/index.html')
          html = p.read_text(encoding='utf-8')
          html = re.sub(r'<title>.*?</title>', '<title>와인노트</title>', html, count=1, flags=re.S)
          html = html.replace('content="wine_tasting"', 'content="와인노트"')
          html = html.replace('content="A new Flutter project."',
                              'content="와인 검색·즐겨찾기·평점·테이스팅 노트"')
          p.write_text(html, encoding='utf-8')
          PY

      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: pub get
        run: flutter pub get

      - name: Analyze & test
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build web
        run: |
          flutter build web --release \
            --pwa-strategy none \
            --web-renderer canvaskit \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=BUILD_ID=${GITHUB_SHA}

      - name: version-info.json + cache busting
        run: |
          SHORT_SHA="${GITHUB_SHA::10}"
          printf '{"build":"%s","time":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > build/web/version-info.json
          # bust the 10-minute Pages cache on the entrypoint scripts
          sed -i "s/flutter_bootstrap.js/flutter_bootstrap.js?v=${SHORT_SHA}/g" build/web/index.html || true
          sed -i "s/main.dart.js/main.dart.js?v=${SHORT_SHA}/g" build/web/flutter_bootstrap.js || true

      - name: SPA 404 fallback
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

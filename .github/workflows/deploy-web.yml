name: Deploy Web (GitHub Pages)

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.22.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Regenerate platform folders (web/) that are gitignored.
      # flutter create 가 만드는 샘플 테스트(MyApp 참조)는 이 앱과 맞지 않아 삭제.
      - name: flutter create
        run: |
          flutter create --platforms web --project-name wine_tasting .
          rm -f test/widget_test.dart

      # 와인 아이콘으로 교체 (web_assets/ — scripts/generate_icons.mjs 로 생성).
      - name: Inject app branding (icons, manifest, title)
        run: |
          cp web_assets/favicon.png web_assets/apple-touch-icon.png web_assets/icon.svg web/
          cp web_assets/icons/*.png web/icons/
          python3 - <<'PY'
          import json, pathlib, re
          m = pathlib.Path('web/manifest.json')
          data = json.loads(m.read_text(encoding='utf-8'))
          data.update({
              'name': '와인노트',
              'short_name': '와인노트',
              'description': '와인 검색·즐겨찾기·평점·테이스팅 노트',
              'background_color': '#FFFFFF',
              'theme_color': '#7B1E3A',
              'orientation': 'portrait-primary',
          })
          m.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')

          p = pathlib.Path('web/index.html')
          html = p.read_text(encoding='utf-8')
          html = re.sub(r'<title>.*?</title>', '<title>와인노트</title>', html, count=1, flags=re.S)
          html = html.replace('content="wine_tasting"', 'content="와인노트"')
          html = html.replace('<link rel="apple-touch-icon" href="icons/Icon-192.png">',
                              '<link rel="apple-touch-icon" href="apple-touch-icon.png">')
          html = html.replace('content="A new Flutter project."',
                              'content="와인 검색·즐겨찾기·평점·테이스팅 노트"')
          p.write_text(html, encoding='utf-8')
          PY

      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: pub get
        run: flutter pub get

      - name: Analyze & test
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build web
        run: |
          flutter build web --release \
            --pwa-strategy none \
            --web-renderer canvaskit \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=BUILD_ID=${GITHUB_SHA}

      - name: version-info.json + cache busting
        run: |
          SHORT_SHA="${GITHUB_SHA::10}"
          printf '{"build":"%s","time":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > build/web/version-info.json
          # bust the 10-minute Pages cache on the entrypoint scripts
          sed -i "s/flutter_bootstrap.js/flutter_bootstrap.js?v=${SHORT_SHA}/g" build/web/index.html || true
          sed -i "s/main.dart.js/main.dart.js?v=${SHORT_SHA}/g" build/web/flutter_bootstrap.js || true
          # 아이콘은 파일명이 Flutter 기본값과 같아서 브라우저·PWA 가 옛 아이콘을 캐시한다.
          # 아이콘 원본(icon.svg) 해시를 붙여 아이콘이 바뀔 때만 URL 이 바뀌게 한다
          # (매 배포마다 바꾸면 설치된 PWA 가 불필요하게 아이콘 갱신을 반복).
          ICON_V="$(sha1sum web_assets/icon.svg | cut -c1-8)"
          sed -i -E "s#href=\"(favicon\.png|apple-touch-icon\.png)\"#href=\"\1?v=${ICON_V}\"#g" build/web/index.html
          sed -i -E "s#\"(icons/Icon-[a-z0-9-]+\.png)\"#\"\1?v=${ICON_V}\"#g" build/web/manifest.json
          grep -o 'href="[^"]*png[^"]*"' build/web/index.html
          grep -o '"icons/[^"]*"' build/web/manifest.json

      - name: SPA 404 fallback
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
